name: Foundation Desktop Qualification

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run desktop qualification or seal a fixed production credential
        type: choice
        required: true
        default: sign
        options: [sign, seal-sentry, seal-vercel]
      target_environment:
        description: API environment for the signed desktop; custody operations ignore this choice
        type: choice
        required: true
        default: staging
        options: [staging, prod]

permissions:
  contents: read

concurrency:
  group: foundation-desktop-signing
  cancel-in-progress: false

env:
  RELEASE: 299f438fbec4f80f1169bdacb2acb080f1d1e05c
  SOURCE_SHA256: 60d066fa625eafff4d916a86d932a26f51a6eeb393642729831b2813f023a264
  VITE_RELEASE: 299f438fbec4f80f1169bdacb2acb080f1d1e05c
  VITE_ENV: ${{ inputs.target_environment || 'staging' }}
  VITE_TELEMETRY_MODE: prod
  VITE_SHELL: desktop
  VITE_API_URL: ${{ inputs.target_environment == 'prod' && 'https://api.proliferate.com' || 'https://api-staging.proliferate.com' }}

jobs:
  sign:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/foundation-signing' && inputs.operation == 'sign'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the fixed desktop environment
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os
          origins={'staging':'https://api-staging.proliferate.com','prod':'https://api.proliferate.com'}
          expected=origins.get(os.environ['VITE_ENV'])
          assert expected and os.environ['VITE_API_URL']==expected, 'desktop environment/API mismatch'
          assert os.environ['VITE_RELEASE']==os.environ['RELEASE'], 'desktop source release mismatch'
          assert os.environ['VITE_SHELL']=='desktop' and os.environ['VITE_TELEMETRY_MODE']=='prod'
          PYCODE
      - name: Fetch the fixed reviewed source archive
        env:
          SOURCE_URL: ${{ secrets.FOUNDATION_SOURCE_URL }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -n "$SOURCE_URL"
          curl --fail --silent --show-error "$SOURCE_URL" --output "$RUNNER_TEMP/source.tar.gz"
          test "$(shasum -a 256 "$RUNNER_TEMP/source.tar.gz" | awk '{print $1}')" = "$SOURCE_SHA256"
          mkdir -p "$RUNNER_TEMP/foundation"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/foundation"
          echo "SOURCE_DIR=$RUNNER_TEMP/foundation" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          package_json_file: ${{ runner.temp }}/foundation/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/foundation/client/apps/desktop/src-tauri
          shared-key: foundation-macos-arm64
      - name: Build the exact candidate before loading Apple credentials
        env:
          VITE_SENTRY_DSN_CLIENT: ${{ secrets.FOUNDATION_SENTRY_DSN_CLIENT }}
          VITE_POSTHOG_KEY: ${{ secrets.PILOT_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.PILOT_POSTHOG_HOST }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: proliferate
          SENTRY_PROJECT: desktop
        run: |
          set -euo pipefail
          test -n "$VITE_SENTRY_DSN_CLIENT"
          test -n "$VITE_POSTHOG_KEY"
          test -n "$VITE_POSTHOG_HOST"
          test -n "$SENTRY_AUTH_TOKEN"
          cd "$SOURCE_DIR"
          pnpm install --frozen-lockfile
          VITE_SOURCEMAPS=1 pnpm --filter @proliferate/desktop build
          pnpm exec sentry-cli sourcemaps inject client/apps/desktop/dist
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          scripts=list(Path('client/apps/desktop/dist').rglob('*.js'))
          assert scripts, 'frontend build has no JavaScript'
          for script in scripts:
              mapping=Path(str(script)+'.map')
              assert mapping.is_file(), f'missing source map: {script.name}'
              record=json.loads(mapping.read_text())
              debug=record.get('debugId') or record.get('debug_id')
              assert debug and 'debugId='+debug in script.read_text(), f'unmatched source map: {script.name}'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SOURCEMAP_PAIRS={len(scripts)}\n')
          PYCODE
          pnpm exec sentry-cli sourcemaps upload --strict --release "$RELEASE" client/apps/desktop/dist
          find client/apps/desktop/dist -name '*.map' -type f -delete
          node client/scripts/assert-dist-clean.mjs client/apps/desktop/dist
          # Compile the already uploaded/injected frontend; the normal hook would rebuild it.
          pnpm --filter @proliferate/desktop exec tauri build --target aarch64-apple-darwin --bundles app --config '{"build":{"beforeBuildCommand":"pnpm prepare:sidecar"}}'
          app="$SOURCE_DIR/client/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Proliferate.app"
          test -d "$app"
          echo "BUILT_APP=$app" >> "$GITHUB_ENV"
      - name: Import existing Apple signing identity into an isolated keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/foundation-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/foundation-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$RUNNER_TEMP/foundation-certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/foundation-certificate.p12"
      - name: Sign Node then record its final hash and sign the containing app
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY"
          test "$SIGNING_IDENTITY" != '-'
          cat > "$RUNNER_TEMP/node-entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.cs.allow-jit</key><true/>
          <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict></plist>
          PLIST
          node_bin="$BUILT_APP/Contents/Resources/runtime/node"
          test -x "$node_bin"
          codesign --force --options runtime --timestamp --entitlements "$RUNNER_TEMP/node-entitlements.plist" --sign "$SIGNING_IDENTITY" "$node_bin"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          app=Path(os.environ['BUILT_APP'])
          resources=app/'Contents/Resources/runtime'
          manifest=resources/'manifest.json'
          record=json.loads(manifest.read_text())
          assert record['release']==os.environ['RELEASE'] and record['env']==os.environ['VITE_ENV']
          assert record['serverOrigin']==os.environ['VITE_API_URL']
          assert record['runtimeSha256']==hashlib.sha256((resources/'anyharness.mjs').read_bytes()).hexdigest()
          record['nodeSha256']=hashlib.sha256((resources/'node').read_bytes()).hexdigest()
          manifest.write_text(json.dumps(record,indent=2)+'\n')
          PYCODE
          "$node_bin" -e 'if (new Function("return 42")() !== 42) process.exit(1)'
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$BUILT_APP"
          codesign --verify --deep --strict --verbose=2 "$BUILT_APP"
          ditto -c -k --keepParent "$BUILT_APP" "$RUNNER_TEMP/Proliferate-notary.zip"
      - name: Notarize, staple and verify the actual candidate app
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APPLE_API_KEY_CONTENT"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/foundation-notary.p8"
          xcrun notarytool submit "$RUNNER_TEMP/Proliferate-notary.zip" --key "$RUNNER_TEMP/foundation-notary.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 20m --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/notary-result.json"))["status"]=="Accepted"'
          xcrun stapler staple "$BUILT_APP"
          xcrun stapler validate "$BUILT_APP"
          codesign --verify --deep --strict --verbose=2 "$BUILT_APP"
          spctl --assess --type execute --verbose=4 "$BUILT_APP"
          mkdir -p "$RUNNER_TEMP/qualification"
          ditto -c -k --keepParent "$BUILT_APP" "$RUNNER_TEMP/qualification/Proliferate-${VITE_ENV}-arm64.zip"
          python3 - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          artifact=root/f"qualification/Proliferate-{os.environ['VITE_ENV']}-arm64.zip"
          receipt={'source_revision':os.environ['RELEASE'],'source_archive_sha256':os.environ['SOURCE_SHA256'],
            'environment':os.environ['VITE_ENV'],'api_origin':os.environ['VITE_API_URL'],'architecture':'arm64','artifact_sha256':hashlib.sha256(artifact.read_bytes()).hexdigest(),
            'notarization':json.loads((root/'notary-result.json').read_text()),'installed_oauth_qualified':False,
            'sentry_project':'proliferate/desktop','sourcemaps_uploaded':True,
            'sourcemap_pairs':int(os.environ['SOURCEMAP_PAIRS']),'served_sourcemaps':False}
          (root/'qualification/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PYCODE
      - name: Retain signed candidate and verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: foundation-desktop-${{ env.VITE_ENV }}-${{ env.RELEASE }}
          path: ${{ runner.temp }}/qualification/
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/foundation-certificate.p12" "$RUNNER_TEMP/foundation-notary.p8"
          security delete-keychain "$RUNNER_TEMP/foundation-signing.keychain-db" || true

  seal-sentry:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'proliferate-ai/proliferate' && github.ref == 'refs/heads/codex/foundation-signing' && inputs.operation == 'seal-sentry'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing repository pin
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the isolated pinned encryption dependency before loading the token
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          /usr/bin/python3 -m venv "$RUNNER_TEMP/sentry-seal-venv"
          "$RUNNER_TEMP/sentry-seal-venv/bin/python" -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r scripts/ci-cd/sentry-custody-requirements.txt
      - name: Seal to the pinned foundation production environment key
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/sentry-seal-venv/bin/python" scripts/ci-cd/seal-sentry-credential.py
      - name: Retain only the sealed credential and exact run receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; existing repository pin
        with:
          name: foundation-sentry-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sentry-custody/sealed.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary custody artifacts
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/sentry-custody" "$RUNNER_TEMP/sentry-seal-venv"

  seal-vercel:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'proliferate-ai/proliferate' && github.ref == 'refs/heads/codex/foundation-signing' && inputs.operation == 'seal-vercel'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; existing repository pin
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the isolated pinned encryption dependency before loading the token
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          /usr/bin/python3 -m venv "$RUNNER_TEMP/vercel-seal-venv"
          "$RUNNER_TEMP/vercel-seal-venv/bin/python" -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r scripts/ci-cd/sentry-custody-requirements.txt
      - name: Verify both Vercel projects and seal to the pinned production environment key
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/vercel-seal-venv/bin/python" scripts/ci-cd/seal-vercel-credential.py
      - name: Retain only the sealed credential and exact run receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; existing repository pin
        with:
          name: foundation-vercel-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vercel-custody/sealed.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary custody artifacts
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/vercel-custody" "$RUNNER_TEMP/vercel-seal-venv"
