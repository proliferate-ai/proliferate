# The one pipeline that moves Main to Production.
#
# States: Main (passed CI), Staging (auto-deployed from green main, the
# standing e2e world), Production. `deploy-staging.yml` owns main -> staging;
# this workflow is the single transition from a main commit to production —
# run unattended by the daily cron (transitional: it retires once the nightly
# e2e battery stands and promotion becomes deliberate) or dispatched by hand.
#
# Hotfix and promote are inputs here, not separate files:
#   hotfix  = ref (exact commit on main) + surfaces (exact set)
#   promote = skip_build on a ref whose artifacts are already built
name: Release

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      surfaces:
        description: >-
          Exact comma-separated surfaces to release and deploy, or all. `all` makes every
          surface eligible and lets change detection since the previous checkpoint pick the
          ones that moved; an explicit list is an exact override that skips detection.
        default: all
        required: false
        type: string
      skip_build:
        description: Deploy an already-built ref; skip the artifact release builds, version bump, and tags.
        default: false
        required: false
        type: boolean
      ref:
        description: Commit SHA or ref to release. Must be an ancestor of main.
        default: main
        required: false
        type: string
      dry_run:
        description: >-
          Exercise the whole graph while suppressing every externally visible effect: no
          version-bump commit, no tags, no artifact releases, no deploy, no product release
          page. This is the standing way to prove a wiring change before it can ship
          anything. Composes with the other inputs: with `surfaces` it plans exactly that
          set, and with `skip_build` it walks the deploy-only shape (which still requires an
          explicit `surfaces` list, because that guard is part of the wiring being proven).
        default: false
        required: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write
  pull-requests: read

concurrency:
  # Name kept verbatim from the retired nightly train so a run still in flight
  # when this file lands cannot deploy production alongside a run of this file.
  group: nightly-release-train
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
      head_sha: ${{ steps.commit.outputs.head_sha }}
      skip_build: ${{ steps.meta.outputs.skip_build }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      product_version: ${{ steps.artifacts.outputs.product_version }}
      product_tag: ${{ steps.artifacts.outputs.product_tag }}
      selected_surfaces: ${{ steps.detect.outputs.selected_surfaces }}
      server: ${{ steps.detect.outputs.server }}
      litellm: ${{ steps.detect.outputs.litellm }}
      web: ${{ steps.detect.outputs.web }}
      desktop: ${{ steps.detect.outputs.desktop }}
      runtime: ${{ steps.detect.outputs.runtime }}
      desktop_version: ${{ steps.artifacts.outputs.desktop_version }}
      runtime_version: ${{ steps.artifacts.outputs.runtime_version }}
      server_version: ${{ steps.artifacts.outputs.server_version }}
      desktop_tag: ${{ steps.artifacts.outputs.desktop_tag }}
      runtime_tag: ${{ steps.artifacts.outputs.runtime_tag }}
      server_tag: ${{ steps.artifacts.outputs.server_tag }}
      artifact_tags: ${{ steps.artifacts.outputs.artifact_tags }}
    steps:
      # actions/checkout resolves a branch, a tag, or a full 40-character SHA.
      # It cannot resolve an abbreviated SHA: it fetches the ref by name and
      # dies with "A branch or tag with the name '<ref>' could not be found".
      # An abbreviated SHA is exactly what an operator copies out of
      # `git log --oneline` or a GitHub commit listing when driving the hotfix
      # or promote path by hand, so run 32452508826 was dispatched with
      # `ref: 6eac131a47` and failed here 9s in, before any release step ran.
      # Re-dispatching the identical commit as its full SHA (run 32453354501)
      # then worked, which is the whole difference. Resolve the input through
      # the API first so every spelling of a commit that exists in this
      # repository reaches checkout as the one spelling it accepts, and so an
      # unresolvable ref fails with a message naming the ref.
      - name: Resolve the release ref to a full commit SHA
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.ref || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${INPUT_REF}" --jq .sha)"; then
            echo "::error::Release ref '${INPUT_REF}' does not resolve to a commit in ${GITHUB_REPOSITORY}. Pass a branch, a tag, or a commit SHA (abbreviated or full) that exists on this repository."
            exit 1
          fi
          echo "Resolved release ref '${INPUT_REF}' to ${sha}."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_REF: ${{ github.event.inputs.ref || '' }}
          SKIP_BUILD: ${{ github.event.inputs.skip_build || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --prune
          head_sha="$(git rev-parse HEAD)"
          release_id="release-$(date -u +%F)"
          previous_train="$(git tag --list 'release-*' --sort=-creatordate | grep -v "^$release_id$" | head -n 1 || true)"
          if [[ -n "$previous_train" ]]; then
            base_sha="$(git rev-parse "$previous_train")"
          else
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || git rev-list --max-parents=0 "$head_sha" | tail -n1)"
          fi
          # Production only ever ships commits that reached main, so an explicit
          # ref (the hotfix and promote paths) must be an ancestor of main.
          if [[ -n "$INPUT_REF" && "$INPUT_REF" != "main" ]]; then
            git merge-base --is-ancestor "$head_sha" refs/remotes/origin/main
          fi
          {
            echo "release_id=$release_id"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "skip_build=$SKIP_BUILD"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - name: Detect release surfaces
        id: detect
        env:
          SURFACES: ${{ github.event.inputs.surfaces || 'all' }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          # This pipeline acts on five of the detector's surfaces: runtime, server,
          # and desktop artifact releases, plus server, litellm, and web production
          # deploys. The detector also knows e2b, mobile, and workers; none of them
          # has a job here (e2b moves only through the manual Promote Cloud Template
          # workflow), so selecting them is a no-op.
          #
          # `all` (the default) means every surface is eligible and change detection
          # since the previous checkpoint decides which ones actually moved, so a
          # night with no changes to a surface does not re-release or redeploy it.
          # An explicit list is the exact override the hotfix path uses.
          only=""
          if [[ "$SURFACES" != "all" ]]; then
            only="$SURFACES"
          fi
          node scripts/ci-cd/detect-deploy-surfaces.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --only "$only"

      # R7: a promote supplies `ref` but may leave `surfaces` at `all`. When the
      # promoted ref is itself the previous checkpoint, detection sees an empty
      # diff, every deploy job's `selected_surfaces != ''` guard is false, and the
      # run goes green having deployed nothing. That is the wrong failure mode for
      # the "get these bytes to production now" path, so fail loudly instead.
      - name: Require an explicit surface set for a deploy-only run
        if: steps.meta.outputs.skip_build == 'true' && steps.detect.outputs.selected_surfaces == ''
        run: |
          echo "::error::skip_build was set but change detection selected no surfaces (base ${{ steps.meta.outputs.base_sha }} == head ${{ steps.meta.outputs.head_sha }}, or nothing deployable changed between them). A deploy-only run must name what to deploy: re-dispatch with an explicit surfaces list, for example 'server,web'."
          exit 1

      # Version bump, tags, and the product release belong to a build run. A
      # skip_build run redeploys an exact ref that has already been through a
      # build run, so it must not move main forward or mint new artifact
      # identities. The hosted lanes still rebuild their images from that same
      # source SHA; this is a deterministic redeploy, not an artifact retag.
      - name: Prepare product and artifact versions
        id: artifacts
        if: steps.meta.outputs.skip_build != 'true'
        run: >
          node scripts/ci-cd/prepare-artifact-release.mjs
          --surfaces "${{ steps.detect.outputs.selected_surfaces }}"
          --release-id "${{ steps.meta.outputs.release_id }}"
          --version-bump patch
          --dry-run "${{ steps.meta.outputs.dry_run }}"

      - name: Verify version tags are free
        # Runs before the version-bump commit is pushed. desktop-v*/server-v*/
        # runtime-v*/proliferate-v* tags must be brand new — prepare-artifact-release
        # already picks the next version past every existing tag, so any of these
        # existing at all here means a real collision (e.g. a race with another
        # run), and we want that to abort before main gets a throwaway commit.
        if: steps.meta.outputs.skip_build != 'true' && steps.meta.outputs.dry_run != 'true' && steps.artifacts.outputs.product_tag != ''
        env:
          ARTIFACT_TAGS: ${{ steps.artifacts.outputs.artifact_tags }}
          PRODUCT_TAG: ${{ steps.artifacts.outputs.product_tag }}
        run: |
          set -euo pipefail
          tags="$PRODUCT_TAG"
          if [[ -n "$ARTIFACT_TAGS" ]]; then
            tags="$tags,$ARTIFACT_TAGS"
          fi
          node scripts/ci-cd/create-release-tags.mjs \
            --target pending \
            --tags "$tags" \
            --check-only true

      - name: Commit version bumps
        id: commit
        env:
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          SKIP_BUILD: ${{ steps.meta.outputs.skip_build }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # A dry run computes the bump so the plan is real, then throws it away:
          # nothing is committed and nothing is pushed to main.
          if [[ "$SKIP_BUILD" == "true" || "$DRY_RUN" == "true" ]]; then
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet; then
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main is branch protected and the workflow's GITHUB_TOKEN cannot
          # satisfy required status checks on a direct push (GH006, run
          # 32446272831). This is the only branch push in the release
          # pipeline, so it alone authenticates with RELEASE_PUSH_TOKEN, an
          # admin fine-grained PAT that bypasses the checks while
          # enforce_admins stays off. Fail loudly before committing if the
          # secret is missing instead of dying opaquely at the push.
          if [[ -z "$RELEASE_PUSH_TOKEN" ]]; then
            echo "::error::RELEASE_PUSH_TOKEN secret is not set; the version-bump push to protected main needs a bypass-capable token."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml anyharness/sdk/package.json
          git commit -m "release: prepare $RELEASE_ID"
          # actions/checkout persists GITHUB_TOKEN as an http.extraheader in
          # .git/config; blank it for this one command so the PAT in the URL
          # is the credential that reaches GitHub.
          git -c "http.https://github.com/.extraheader=" \
            push "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release tags
        if: steps.meta.outputs.skip_build != 'true' && steps.meta.outputs.dry_run != 'true' && steps.artifacts.outputs.product_tag != ''
        env:
          ARTIFACT_TAGS: ${{ steps.artifacts.outputs.artifact_tags }}
          PRODUCT_TAG: ${{ steps.artifacts.outputs.product_tag }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          tags="$PRODUCT_TAG,$RELEASE_ID"
          if [[ -n "$ARTIFACT_TAGS" ]]; then
            tags="$tags,$ARTIFACT_TAGS"
          fi
          # RELEASE_ID (release-YYYY-MM-DD) is a checkpoint marker, not a version
          # pointer: this workflow's own "Resolve release metadata" step is its
          # only reader, and it always excludes *today's* release_id when picking
          # the previous checkpoint. A same-day rerun should move it forward to
          # the new head, not fail the whole run.
          node scripts/ci-cd/create-release-tags.mjs \
            --target "${{ steps.commit.outputs.head_sha }}" \
            --tags "$tags" \
            --movable-tags "$RELEASE_ID" \
            --dry-run false

      - name: Summarize plan
        run: |
          {
            echo "### Release plan"
            echo "- Product: \`${{ steps.artifacts.outputs.product_tag || 'no release' }}\`"
            echo "- Checkpoint: \`${{ steps.meta.outputs.release_id }}\`"
            echo "- Ref: \`${{ github.event.inputs.ref || 'main' }}\` (resolved to \`${{ steps.ref.outputs.sha }}\`)"
            echo "- Base: \`${{ steps.meta.outputs.base_sha }}\`"
            echo "- Head: \`${{ steps.commit.outputs.head_sha }}\`"
            echo "- Skip build: \`${{ steps.meta.outputs.skip_build }}\`"
            echo "- Dry run: \`${{ steps.meta.outputs.dry_run }}\`"
            if [[ "${{ steps.meta.outputs.dry_run }}" == "true" ]]; then
              echo "- **Dry run: nothing was committed, tagged, released, or deployed.** The versions and tags below are the plan this run would have executed."
            fi
            echo "- Selected surfaces: \`${{ steps.detect.outputs.selected_surfaces }}\`"
            echo "- Desktop: \`${{ steps.artifacts.outputs.desktop_tag }}\`"
            echo "- Runtime: \`${{ steps.artifacts.outputs.runtime_tag }}\`"
            echo "- Server: \`${{ steps.artifacts.outputs.server_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Release builds ────────────────────────────────────────────────────────────
  # Artifact identities for this head. Skipped entirely on a promote run, whose
  # artifacts already exist, and on a dry run. The reusable build lanes have no
  # cheap no-op switch: their own `dry_run` input still compiles everything, and a
  # macOS desktop matrix is not a proportionate price for a wiring proof. This is
  # how the retired train's plan-only dry run behaved too. The deploy lanes below
  # do have such a switch, so a dry run still walks their call wiring.

  release-runtime:
    needs: [prepare]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip_build != 'true' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.runtime == 'true' }}
    uses: ./.github/workflows/release-runtime.yml
    with:
      git_sha: ${{ needs.prepare.outputs.head_sha }}
      version: ${{ needs.prepare.outputs.runtime_version }}
      dry_run: false
      publish: true
    secrets: inherit

  release-server:
    needs: [prepare]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip_build != 'true' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.server == 'true' }}
    permissions:
      contents: write
      packages: write
    # `_build-server.yml`, not `server-ci.yml`: this head is already on `main`,
    # so `server-ci-ok` has already gated it. The build brick carries no lint or
    # test jobs on purpose -- see the note at the top of that file.
    uses: ./.github/workflows/_build-server.yml
    with:
      git_sha: ${{ needs.prepare.outputs.head_sha }}
      version: ${{ needs.prepare.outputs.server_version }}
      dry_run: false
      publish: true
    secrets: inherit

  release-desktop:
    needs: [prepare]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.skip_build != 'true' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.desktop == 'true' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      git_sha: ${{ needs.prepare.outputs.head_sha }}
      version: ${{ needs.prepare.outputs.desktop_version }}
      dry_run: false
      # Zero-touch auto-prod: publish the updater/download assets so existing
      # installs auto-update on every release. release-desktop.yml is not bound
      # to a GitHub Environment, so there is no approval gate on this step.
      publish_updater: true
      target_os: all
      # Deliberately not opted into the Windows beta leg (see B2 in PR #2150):
      # this is the unattended zero-touch auto-prod path with no approval
      # gate, and the Windows leg has never completed a real build. Leaving
      # this at its `false` default means `target_os: all` still only builds
      # macOS here. Flip to `true` only once the Windows leg has a proven
      # green dry run and B1 (continue-on-error run-conclusion) is resolved.
      enable_windows_beta: false
    secrets: inherit

  # ── Production deploys ────────────────────────────────────────────────────────
  # Hosted surfaces deploy from prepare, not from the release builds: each
  # reusable lane builds its own exact-SHA image. Artifact handoff between the
  # build jobs and these deploys is a separate follow-up.
  #
  # A dry run still calls every lane so the `uses:` resolution, the input wiring,
  # and the needs-graph edges are all exercised; it just passes `enabled: false`,
  # which is the same no-op switch an unselected surface uses, so the inner job
  # that touches AWS or Vercel never starts.

  deploy-server-prod:
    needs: [prepare]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.selected_surfaces != '' }}
    uses: ./.github/workflows/_deploy-server.yml
    with:
      environment: production
      git_sha: ${{ needs.prepare.outputs.head_sha }}
      enabled: ${{ needs.prepare.outputs.server == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    secrets: inherit

  deploy-litellm-prod:
    needs: [prepare]
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.selected_surfaces != '' }}
    uses: ./.github/workflows/_deploy-litellm.yml
    with:
      environment: production
      git_sha: ${{ needs.prepare.outputs.head_sha }}
      enabled: ${{ needs.prepare.outputs.litellm == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    secrets: inherit

  deploy-web-prod:
    # Server before web: the web surface may call API endpoints that only the
    # new server revision serves, so web waits for a selected server deploy and
    # does not roll when that deploy failed.
    needs: [prepare, deploy-server-prod]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.selected_surfaces != '' &&
        (
          needs.prepare.outputs.dry_run == 'true' ||
          needs.prepare.outputs.server != 'true' ||
          needs.deploy-server-prod.result == 'success'
        )
      }}
    uses: ./.github/workflows/_deploy-web.yml
    with:
      environment: production
      git_sha: ${{ needs.prepare.outputs.head_sha }}
      enabled: ${{ needs.prepare.outputs.web == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    secrets: inherit

  publish-product-release:
    # Gates on the release builds only. Hosted deploys are not artifact
    # identities, so a product release page can publish while production is
    # still rolling or after production later fails. On a dry run the builds are
    # skipped, so the gate falls through to the script's own --dry-run, which
    # renders the release body without creating or updating anything.
    needs:
      - prepare
      - release-runtime
      - release-server
      - release-desktop
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.skip_build != 'true' &&
        needs.prepare.outputs.product_tag != '' &&
        needs.prepare.outputs.selected_surfaces != '' &&
        (
          needs.prepare.outputs.dry_run == 'true' ||
          (
            (needs.prepare.outputs.runtime != 'true' || needs.release-runtime.result == 'success') &&
            (needs.prepare.outputs.server != 'true' || needs.release-server.result == 'success') &&
            (needs.prepare.outputs.desktop != 'true' || needs.release-desktop.result == 'success')
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Publish product GitHub Release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node scripts/ci-cd/publish-product-release.mjs
          --kind nightly
          --release-tag "${{ needs.prepare.outputs.product_tag }}"
          --product-tag "${{ needs.prepare.outputs.product_tag }}"
          --release-id "${{ needs.prepare.outputs.release_id }}"
          --base "${{ needs.prepare.outputs.base_sha }}"
          --head "${{ needs.prepare.outputs.head_sha }}"
          --surfaces "${{ needs.prepare.outputs.selected_surfaces }}"
          --artifact-tags "${{ needs.prepare.outputs.artifact_tags }}"
          --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --repository "${{ github.repository }}"
          --body-out product-release.md
          --dry-run "${{ needs.prepare.outputs.dry_run }}"

      - name: Summarize product release page
        run: |
          {
            echo "### Product GitHub Release"
            echo "- Action: \`${{ steps.publish.outputs.release_action }}\`"
            echo "- Tag: \`${{ steps.publish.outputs.release_tag }}\`"
            echo "- URL: ${{ steps.publish.outputs.release_url }}"
            echo ""
            cat product-release.md
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    needs:
      - prepare
      - release-runtime
      - release-server
      - release-desktop
      - deploy-server-prod
      - deploy-litellm-prod
      - deploy-web-prod
      - publish-product-release
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        run: |
          {
            echo "### Release result"
            if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
              echo "- **DRY RUN. No commit, tag, artifact release, deploy, or product release page was produced.**"
            fi
            echo "- Product: \`${{ needs.prepare.outputs.product_tag || 'no release' }}\`"
            echo "- Checkpoint: \`${{ needs.prepare.outputs.release_id }}\`"
            echo "- Head: \`${{ needs.prepare.outputs.head_sha }}\`"
            echo "- Surfaces: \`${{ needs.prepare.outputs.selected_surfaces }}\`"
            echo "- Skip build: \`${{ needs.prepare.outputs.skip_build }}\`"
            echo "- Dry run: \`${{ needs.prepare.outputs.dry_run }}\`"
            echo "- Runtime release: \`${{ needs.release-runtime.result }}\`"
            echo "- Server release: \`${{ needs.release-server.result }}\`"
            echo "- Desktop release: \`${{ needs.release-desktop.result }}\`"
            echo "- Server prod: \`${{ needs.deploy-server-prod.result }}\`"
            echo "- LiteLLM prod: \`${{ needs.deploy-litellm-prod.result }}\`"
            echo "- Web prod: \`${{ needs.deploy-web-prod.result }}\`"
            echo "- Product release: \`${{ needs.publish-product-release.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
