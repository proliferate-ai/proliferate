# Staging deploys automatically from green main: a `CI` run that completes
# successfully on main fires this workflow at that run's exact head commit
# (the plan job still waits for Server CI on that SHA, so both rollups gate).
# Operators keep workflow_dispatch for reruns, forced surfaces, and dry runs.
# Production is untouched by this path: release.yml stays its only entrypoint.
name: Deploy Staging
# The UI otherwise shows the default-branch head for every workflow_run event,
# which reads as "deploying X" while actually deploying Y.
run-name: "Deploy Staging · ${{ github.event.workflow_run.head_sha || github.event.inputs.ref || github.sha }} · ${{ github.event_name }}"

on:
  workflow_run:
    # Either rollup's completion can be the one that finds both green; the plan
    # deploys only when CI AND Server CI are both success for the deploy head,
    # and the earlier event exits neutrally. Re-running a red rollup to green
    # re-fires this trigger (the old in-job poll caught neither re-runs nor
    # anything beyond its 45-minute window).
    workflows: ["CI", "Server CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy. Defaults to the dispatch ref.
        required: false
        type: string
      force_surfaces:
        description: Comma-separated surfaces to force, or all.
        required: false
        type: string
      only_surfaces:
        description: Exact comma-separated surfaces to deploy, or all. Overrides detection and force_surfaces.
        required: false
        type: string
      dry_run:
        description: Plan only; do not deploy.
        default: false
        required: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # One staging deploy at a time, and never cancel one mid-roll. Events that
  # cannot deploy (a red CI, or a non-push trigger) get their own group so they
  # never contend for — or cancel — a pending real deploy.
  group: deploy-staging-${{ github.repository }}-${{ (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push')) && github.run_id || 'main' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    # Auto runs deploy only what CI proved ON MAIN IN THIS REPOSITORY: the
    # workflow_run `branches:` filter matches the triggering run's head branch,
    # which a fork PR can name `main`, so a success from any event other than a
    # push to this repo's main plans nothing (every downstream job needs plan's
    # success). This is the trust boundary; never relax it.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.detect.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
      proceed: ${{ steps.head.outputs.proceed }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      server: ${{ steps.detect.outputs.server }}
      workers: ${{ steps.detect.outputs.workers }}
      litellm: ${{ steps.detect.outputs.litellm }}
      e2b: ${{ steps.detect.outputs.e2b }}
      web: ${{ steps.detect.outputs.web }}
      mobile: ${{ steps.detect.outputs.mobile }}
      desktop: ${{ steps.detect.outputs.desktop }}
      runtime: ${{ steps.detect.outputs.runtime }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}
      selection_mode: ${{ steps.detect.outputs.selection_mode }}
      selected_surfaces: ${{ steps.detect.outputs.selected_surfaces }}
      summary_json: ${{ steps.detect.outputs.summary_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Dispatch: the operator's ref (or the dispatch SHA). Auto: the exact
          # commit the triggering CI run proved green.
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy metadata
        id: meta
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          dry_run="${DRY_RUN:-false}"
          {
            echo "head_sha=$head_sha"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: Resolve the deploy head and base
        id: head
        # One step owns "what do we deploy, from what base, and may we":
        #   1. Auto runs advance to the NEWEST first-parent main commit
        #      at-or-after the event head whose CI and Server CI rollups are
        #      both success — deploys converge on the newest proven commit no
        #      matter which rollup finished last or in what order the events
        #      arrive (post-merge refuter findings on #2269: completion-order
        #      latest-wins could cancel a newer commit's deploy in favor of an
        #      older one's). If nothing at-or-after the head is fully green
        #      yet, exit neutrally: a later completion event will deploy.
        #   2. Dispatch runs deploy the operator's exact ref, single-shot
        #      checked: an existing red or pending rollup refuses out loud; a
        #      missing rollup warns and continues (operator judgment).
        #   3. The regression guard: never deploy a head that the last
        #      successfully deployed commit does not precede — an out-of-order
        #      event cannot roll staging backwards.
        run: |
          set -euo pipefail
          event_head="${{ steps.meta.outputs.head_sha }}"

          rollup_status() {
            local sha="$1" wf="$2"
            gh run list \
              --workflow "$wf" \
              --commit "$sha" \
              --limit 10 \
              --json createdAt,status,conclusion \
              --jq '[.[] | select(.conclusion != "skipped")] | sort_by(.createdAt) | last
                    | if . == null then "missing"
                      elif .status != "completed" then "pending"
                      else .conclusion end'
          }

          deploy_head=""
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            git fetch --quiet origin main
            while read -r candidate; do
              git merge-base --is-ancestor "$event_head" "$candidate" || continue
              green=true
              for wf in ci.yml server-ci.yml; do
                status="$(rollup_status "$candidate" "$wf")"
                echo "$wf @ ${candidate:0:9}: $status"
                [[ "$status" == "success" ]] || { green=false; break; }
              done
              if [[ "$green" == "true" ]]; then
                deploy_head="$candidate"
                break
              fi
            done < <(git rev-list --first-parent --max-count=30 origin/main)

            if [[ -z "$deploy_head" ]]; then
              echo "No fully green main commit at-or-after $event_head yet; the other rollup's completion event will deploy."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            deploy_head="$event_head"
            for wf in ci.yml server-ci.yml; do
              status="$(rollup_status "$deploy_head" "$wf")"
              case "$status" in
                success) echo "$wf green for $deploy_head." ;;
                missing) echo "::warning::No $wf run found for $deploy_head; continuing on operator judgment." ;;
                *)
                  echo "::error::$wf for $deploy_head is $status; deploy refused. Re-dispatch once it is green." >&2
                  exit 1
                  ;;
              esac
            done
          fi

          fallback="$(git rev-parse "${deploy_head}^" 2>/dev/null || git rev-list --max-parents=0 "$deploy_head" | tail -n1)"
          base_sha="$(
            node scripts/ci-cd/resolve-deploy-base.mjs \
              --workflow deploy-staging.yml \
              --branch main \
              --head "$deploy_head" \
              --fallback "$fallback" \
              --required-artifact deploy-summary-staging
          )"
          base_mode="$(grep '^base_mode=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2)"

          if [[ "$base_mode" == "resolved" ]] && ! git merge-base --is-ancestor "$base_sha" "$deploy_head"; then
            echo "Regression guard: last deployed $base_sha is not an ancestor of $deploy_head; refusing to move staging backwards."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "deploy_head=$deploy_head"
            echo "base_sha=$base_sha"
            echo "proceed=true"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Detect deploy surfaces
        if: ${{ steps.head.outputs.proceed == 'true' }}
        id: detect
        run: >
          node scripts/ci-cd/detect-deploy-surfaces.mjs
          --base "${{ steps.head.outputs.base_sha }}"
          --head "${{ steps.head.outputs.deploy_head }}"
          --force "$FORCE_SURFACES"
          --only "$ONLY_SURFACES"
        env:
          # A staleness fallback (no resolvable prior deploy) must deploy the
          # full surface set, not head^-diff to a near-no-op — unless the
          # operator explicitly chose surfaces.
          FORCE_SURFACES: ${{ github.event.inputs.force_surfaces || (steps.head.outputs.base_mode == 'fallback' && 'all') || '' }}
          ONLY_SURFACES: ${{ github.event.inputs.only_surfaces || '' }}

      - name: Summarize plan
        if: ${{ steps.head.outputs.proceed == 'true' }}
        run: |
          {
            echo "### Staging deploy plan"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Base: \`${{ steps.detect.outputs.base_sha }}\` (\`${{ steps.head.outputs.base_mode }}\`)"
            echo "- Head: \`${{ steps.detect.outputs.head_sha }}\`"
            echo "- Changed files: \`${{ steps.detect.outputs.changed_files_count }}\`"
            echo "- Dry run: \`${{ steps.meta.outputs.dry_run }}\`"
            echo "- Selection: \`${{ steps.detect.outputs.selection_mode }}\`"
            echo "- Forced surfaces: \`${{ steps.detect.outputs.forced_surfaces }}\`"
            echo "- Only surfaces: \`${{ steps.detect.outputs.only_surfaces }}\`"
            echo "- Selected surfaces: \`${{ steps.detect.outputs.selected_surfaces }}\`"
            echo ""
            echo "| Surface | Deploy |"
            echo "| --- | --- |"
            echo "| server | \`${{ steps.detect.outputs.server }}\` |"
            echo "| workers | \`${{ steps.detect.outputs.workers }}\` |"
            echo "| litellm | \`${{ steps.detect.outputs.litellm }}\` |"
            echo "| e2b | \`${{ steps.detect.outputs.e2b }}\` |"
            echo "| web | \`${{ steps.detect.outputs.web }}\` |"
            echo "| mobile | \`${{ steps.detect.outputs.mobile }}\` |"
            echo "| desktop | \`${{ steps.detect.outputs.desktop }}\` |"
            echo "| runtime | \`${{ steps.detect.outputs.runtime }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-server:
    needs: [plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true' && needs.plan.outputs.dry_run != 'true' }}
    uses: ./.github/workflows/_deploy-server.yml
    with:
      environment: staging
      git_sha: ${{ needs.plan.outputs.head_sha }}
      enabled: ${{ needs.plan.outputs.server == 'true' }}
    secrets: inherit

  deploy-litellm:
    needs: [plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true' && needs.plan.outputs.dry_run != 'true' }}
    uses: ./.github/workflows/_deploy-litellm.yml
    with:
      environment: staging
      git_sha: ${{ needs.plan.outputs.head_sha }}
      enabled: ${{ needs.plan.outputs.litellm == 'true' }}
    secrets: inherit

  deploy-web:
    needs: [plan, deploy-server]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true' && needs.plan.outputs.dry_run != 'true' }}
    uses: ./.github/workflows/_deploy-web.yml
    with:
      environment: staging
      git_sha: ${{ needs.plan.outputs.head_sha }}
      enabled: ${{ needs.plan.outputs.web == 'true' }}
    secrets: inherit

  deploy-desktop:
    needs: [plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true' && needs.plan.outputs.dry_run != 'true' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_deploy-desktop.yml
    with:
      environment: staging
      git_sha: ${{ needs.plan.outputs.head_sha }}
      enabled: ${{ needs.plan.outputs.desktop == 'true' }}
      dry_run: true
      publish_updater: false
    secrets: inherit

  summary:
    needs:
      - plan
      - deploy-server
      - deploy-litellm
      - deploy-web
      - deploy-desktop
    # A guarded run (proceed=false) writes no summary artifact: the artifact is
    # the base-resolution anchor, and an undeployed head must never become one.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy summary artifact
        run: |
          set -euo pipefail
          mkdir -p deploy-summary
          cat > deploy-summary/staging.json <<'JSON'
          ${{ needs.plan.outputs.summary_json }}
          JSON
          {
            echo "### Staging deploy result"
            echo "- Head: \`${{ needs.plan.outputs.head_sha }}\`"
            echo "- Server: \`${{ needs.deploy-server.result }}\`"
            echo "- LiteLLM: \`${{ needs.deploy-litellm.result }}\`"
            echo "- Web: \`${{ needs.deploy-web.result }}\`"
            echo "- Desktop: \`${{ needs.deploy-desktop.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.plan.outputs.dry_run == 'true' && 'deploy-plan-staging' || 'deploy-summary-staging' }}
          path: deploy-summary/staging.json
