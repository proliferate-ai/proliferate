[package]
name = "proliferate-diagnostics-collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone bounded diagnostics collector for Proliferate Desktop"

[features]
default = []
# Internal/dogfood builds only. Compiles the provider-neutral OTLP export
# adapter into the binary. Customer releases build this package with default
# features, so no export path, destination read, or credential handling exists
# in a shipped collector.
internal-dogfood-export = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
libc.workspace = true
proliferate-diagnostics-protocol.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
