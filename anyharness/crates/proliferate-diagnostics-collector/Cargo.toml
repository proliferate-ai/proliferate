[package]
name = "proliferate-diagnostics-collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone bounded diagnostics collector for Proliferate Desktop"

[features]
default = []
# Widens what a build may export. The provider-neutral OTLP adapter is now
# compiled into every build, so this feature no longer decides whether an
# export path exists; it decides what that path admits. Default features
# compile `ExportPolicy::LifecycleOnly`, so a customer collector can export
# `record_class == lifecycle` only and the detailed class, the only class that
# can carry free text, never leaves the machine. This feature compiles
# `ExportPolicy::All` and adds the per-developer `dev.user` tag. See
# `src/export/policy.rs`; the desktop release job asserts the compiled policy
# on every packaged collector.
internal-dogfood-export = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
libc.workspace = true
proliferate-diagnostics-protocol.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
