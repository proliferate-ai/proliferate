# System manifest (Organization Standard rule 2) — validated by
# scripts/check_manifests.py; rules PROD-MANIFEST-001/002 in
# lints/product/manifests.toml. allowed_importers is measured reality, not
# permission-by-intention: the checker fails on drift in either direction.

name = "github"
spec = "specs/FEATURE_DOCS/SANDBOX/github-auth.md"
owns = "GitHub App installations, user authorization, repo authority, and webhook intake."

public_surface = [
    "proliferate.server.cloud.github_app.api",
    "proliferate.server.cloud.github_app.service",
    "proliferate.server.cloud.github_app.models",
]

allowed_importers = [
    "cloud",
    "cloud/materialization",
    "cloud/repos",
    "cloud/repositories",
    "cloud/webhooks",
    "cloud/workspaces",
    "main.py",
]
