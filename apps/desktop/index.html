<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proliferate</title>
    <script>
      var m = localStorage.getItem("proliferate-mode") || "dark";
      var resolvedMode =
        m === "system"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
          : m === "light"
            ? "light"
            : "dark";
      document.documentElement.dataset.mode = resolvedMode;
      document.documentElement.style.colorScheme = resolvedMode;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- DEV-ONLY light-mode profile hook (worktree branch, never merges):
         ?profile=codex|paper|structured|soft-depth applies that candidate and
         pins light mode; ?profile=off clears it. Sticks via localStorage, so
         setting localStorage["dev-theme-profile"] in devtools works too. -->
    <script>
      (function () {
        var KEY = "dev-theme-profile";
        var params = new URLSearchParams(location.search);
        var fromUrl = params.get("profile");
        if (fromUrl === "off" || fromUrl === "") {
          try { localStorage.removeItem(KEY); } catch (e) {}
          return;
        }
        var profile;
        try { profile = fromUrl || localStorage.getItem(KEY); } catch (e) { profile = fromUrl; }
        if (!profile) return;
        try { localStorage.setItem(KEY, profile); } catch (e) {}
        var el = document.documentElement;
        function apply() {
          el.setAttribute("data-mode", "light");
          el.style.colorScheme = "light";
          el.setAttribute("data-theme-profile", profile);
        }
        apply();
        // Pin light only through app boot (initializeTheme forces dark at
        // startup); after that, let the Appearance setting win so Dark works.
        var observer = new MutationObserver(function () {
          if (el.getAttribute("data-mode") !== "light") apply();
        });
        observer.observe(el, { attributes: true, attributeFilter: ["data-mode"] });
        setTimeout(function () { observer.disconnect(); }, 3000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
