<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative release preparation and human approval</title>
  <desc id="desc">Concept illustration, not a product recording or real release status. Tests, a migration check, and a changelog are prepared alongside draft release notes. The release waits for human approval.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#292722}.muted{fill:#676159}.icon{stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="720" height="420" rx="18" fill="#F4F1E9"/>
  <text x="32" y="66" font-size="30" font-weight="600" letter-spacing="-0.8">Release checklist</text>
  <rect x="534" y="30" width="154" height="29" rx="14.5" fill="#FFF9F3" stroke="#D9B29A"/>
  <text x="611" y="50" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="0.9" style="fill:#93401E">ILLUSTRATIVE</text>
  <rect x="32" y="99" width="656" height="289" rx="14" fill="#FFFFFF" stroke="#D9D4CA"/>
  <text x="56" y="137" font-size="17" letter-spacing="0.8" class="muted">PREPARATION</text>
  <circle cx="71" cy="178" r="14" fill="#E5EFE3"/>
  <path d="m65 178 4 4 8-9" stroke="#376445" stroke-width="2.5" class="icon"/>
  <text x="101" y="186" font-size="23" font-weight="500">Tests passed</text>
  <circle cx="71" cy="233" r="14" fill="#E5EFE3"/>
  <path d="m65 233 4 4 8-9" stroke="#376445" stroke-width="2.5" class="icon"/>
  <text x="101" y="241" font-size="23" font-weight="500">Migration checked</text>
  <circle cx="71" cy="288" r="14" fill="#E5EFE3"/>
  <path d="m65 288 4 4 8-9" stroke="#376445" stroke-width="2.5" class="icon"/>
  <text x="101" y="296" font-size="23" font-weight="500">Changelog drafted</text>
  <rect x="425" y="119" width="239" height="192" rx="10" fill="#F6F3EC" stroke="#DDD5C7"/>
  <text x="445" y="151" font-size="19" font-weight="550">Release notes</text>
  <path d="M445 167H644" stroke="#DBD3C5"/>
  <text x="445" y="202" font-size="23" font-weight="550">CSV export</text>
  <rect x="445" y="221" width="180" height="5" rx="2.5" fill="#D8D1C4"/>
  <rect x="445" y="234" width="150" height="5" rx="2.5" fill="#D8D1C4"/>
  <rect x="445" y="267" width="68" height="26" rx="6" fill="#EAE4D8"/>
  <text x="479" y="285" text-anchor="middle" font-size="17" class="muted">Draft</text>
  <rect x="56" y="333" width="608" height="36" rx="8" fill="#EEECE6"/>
  <circle cx="76" cy="351" r="5" fill="#676159"/>
  <text x="94" y="358" font-size="21" font-weight="550">Waiting for your approval</text>
  <path d="M632 351h12m-5-5 5 5-5 5" stroke="#676159" stroke-width="2" class="icon"/>
</svg>
