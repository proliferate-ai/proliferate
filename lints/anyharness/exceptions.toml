# AnyHarness exception ledger — grandfathered violation sites, one entry per site.
#
# Converted from the retired scripts/anyharness_boundaries_allowlist.txt, whose
# rows were per-file COUNTS. A count tolerates any N hits in a file; these entries
# name the exact sites, so a cleanup that removes one and a regression that adds
# another can no longer cancel out. `site` is a content fingerprint —
# `<enclosing symbol>::<matched token or import path>`, never a line number — so
# reformatting and moves inside a file do not churn the ledger. A `#2` suffix is
# an occurrence ordinal for a repeated token inside one symbol, not a line.
#
# Reasons are carried verbatim from the allowlist row that covered the file.
# This is migration debt, not permission for new code: a net-new entry is an
# amendment (lints/README.md) and needs founder approval. Removing debt means
# deleting the entry in the same PR — a site that no longer violates fails the
# check as stale.
#
# Known scope limits inherited from the checker (deliberate, not bugs to file):
#
# - Store-by-role files. A `*_store.rs` outside a `store/` directory (e.g.
#   domains/workspaces/access_store.rs) is a store by role but not by path, so
#   AH-STORE-3 polices its SQL while AH-STORE-1 / AH-STORE-2 do not treat it as
#   store code. Moving the file under `store/` retires the SQL entry and enrols it
#   in the store rules at once; until then the asymmetry stands.
#
# - The engine cannot see `#[cfg(test)]` boundaries inside otherwise-production
#   files, so several entries below cover setup code in inline test mods. Those
#   say so in their reason and are not cleanup targets.
#
# - AppState field access is only partly mechanical. AH-API-2 catches the store
#   case (`state.<x>_store`) because a `*_store` field name is a reliable signal,
#   and only for the identifier `state` (how every api/** handler param is spelled
#   today). Reaching another domain innard through an AppState field, or through
#   `app_state.foo_store` / a rebound clone, has no such name to key off and stays
#   a judgment call for review.
#
# - SQL detection is lexical, so an uppercase SQL verb heading an ordinary string
#   matches: `bail!("UPDATE failed for {id}")` is indistinguishable from
#   `"UPDATE sessions SET .."` without parsing Rust. Such a hit is a seedable
#   false positive, not a defect. The exact literal `"SELECT"` is excluded (keyword
#   constant / serde rename) while `"SELECT " + cols` still counts, and SQL inside
#   a `/* .. */` block comment counts because comment stripping only understands
#   `//`. All of these are pinned by unit tests so they stay visible.

