# AnyHarness cross-domain fences — which sibling DOMAINS inside anyharness-lib
# may reference which (the layer order is boundaries.toml's job; this file owns
# the domain→domain edge set). Enforced by scripts/check_anyharness_fences.py,
# introduced in warn mode by the cull-sweep Wave 0
# (delivery/cull-sweep/delivery-spec-wave0-manifests-and-checkers.md).
#
# The [[edge]] tables below are AH-FENCE-001's baseline: the measured
# domain→domain reference graph at fence introduction — permissive by
# construction, shrink-only afterwards. The checker fails on a new edge AND on
# a stale row, so this list always equals reality exactly. Removing a row when
# its last crossing site dies is maintenance; adding a row is a net-new
# coupling and therefore an amendment (see lints/README.md Constitution).
#
# Grandfathered AH-FENCE-002 sites live in exceptions.toml, one entry per site.
# See lints/README.md for the record and ledger contract.

[[rule]]
id = "AH-FENCE-001"
title = "domains reference siblings only along declared edges"
owner = "anyharness"
status = "law"
enforced_by = "scripts/check_anyharness_fences.py"
mode = "lint"
scope = "anyharness/crates/anyharness-lib/src/domains/**"

rule = """A domain may reference a sibling domain only along a domain→domain edge declared in the [[edge]] baseline of this record file; the baseline may only shrink."""
alternative = """Express the need through an already-declared edge, or move the shared concept into the domain that both sides may already reach. A genuinely new edge is a constitution amendment: flag it in the PR description and stop for founder review."""
why = """Domain moves must not quietly add coupling: freezing the measured edge graph (43 edges at introduction, 2026-08-25) makes every new domain edge a visible amendment and gives any later re-grouping a shrink-only starting line."""

[rule.example]
bad = """`use crate::domains::billing::model::Invoice;` from a domain with no declared edge to billing"""
good = """the same import along an edge the baseline already declares"""

[[rule]]
id = "AH-FENCE-002"
title = "domains do not reach a sibling domain's store"
owner = "anyharness"
status = "holds"
enforced_by = "scripts/check_anyharness_fences.py"
mode = "lint"
scope = "anyharness/crates/anyharness-lib/src/domains/**"

rule = """A domain must not import or name a sibling domain's store (`crate::domains::<other>::store..`)."""
alternative = """Call a facade method on the owning domain's service, or take the fact as a parameter wired in app/ — the sibling's persistence shape is private to it."""
why = """A store reached across a domain fence couples the reacher to persistence shape it cannot maintain; every schema change in the owner becomes a hidden breaking change in the reacher. The grandfathered sites are the measured reality at fence introduction (2026-08-25), one fingerprint per site, and may only shrink."""

[rule.example]
bad = """`use crate::domains::sessions::store::SessionStore;` inside domains/activity/**"""
good = """`use crate::domains::sessions::service::SessionService;` and a facade method that owns the query"""

