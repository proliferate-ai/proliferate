# Product-client directory fences — which top-level directories of
# apps/packages/product-client/src may import which (the layer DIRECTION is
# product-client.toml's job; this file owns the directory→directory edge set).
# Enforced by scripts/check_frontend_fences.py, introduced in warn mode by the
# cull-sweep Wave 0
# (delivery/cull-sweep/delivery-spec-wave0-manifests-and-checkers.md) and
# enforcing since 2026-08-25 (testing system spec, minimum-tonight PR 1).
#
# The [[edge]] tables below are FE-FENCE-001's baseline: the measured
# directory→directory import graph at fence introduction — permissive by
# construction, shrink-only afterwards.
# The checker fails on a new edge AND on a stale row, so this list always
# equals reality exactly. Removing a row when its last crossing import dies is
# maintenance; adding a row is a net-new coupling and therefore an amendment
# (see lints/README.md Constitution).

[[rule]]
id = "FE-FENCE-001"
title = "product-client directories import along declared edges only"
owner = "frontend"
status = "law"
enforced_by = "scripts/check_frontend_fences.py"
mode = "lint"
scope = "apps/packages/product-client/src/**"

rule = """A top-level directory of product-client/src may import another top-level directory only along a directory→directory edge declared in the [[edge]] baseline of this record file; the baseline may only shrink."""
alternative = """Import along an already-declared edge, or move the shared module to a directory both sides may already reach. A genuinely new edge is a constitution amendment: flag it in the PR description and stop for founder review."""
why = """Directory moves must not quietly add coupling: freezing the measured edge graph (77 edges at introduction, 2026-08-25) makes every new cross-directory dependency a visible amendment and gives any later re-grouping a shrink-only starting line."""

[rule.example]
bad = """`import { x } from "#product/stores/session-store";` from a directory with no declared edge to stores"""
good = """the same import along an edge the baseline already declares"""

