# Frontend exception ledger - grandfathered violation sites, one entry per site.
#
# Converted from the retired scripts/frontend_boundaries_allowlist.txt, whose rows
# were per-file COUNTS. A count tolerates any N hits in a file, so a cleanup that
# removed one site and a regression that added another cancelled out silently.
# These entries name the exact sites instead: every repair is a deletion, and a
# new hit in an already-listed file is a failure rather than a wash.
#
# `site` is a content fingerprint - `<enclosing symbol>::<matched specifier or
# token>`, never a line number - so reformatting and moves inside a file do not
# churn the ledger. An import that sits above the first declaration has no
# enclosing symbol, so its fingerprint is the bare specifier. A `#2` suffix is an
# occurrence ordinal for a repeated token inside one symbol, not a line number.
#
# Reasons are carried verbatim from the allowlist row that covered the file.
# This is migration debt, not permission for new code: a net-new entry is an
# amendment (lints/README.md) and needs founder approval. Removing debt means
# deleting the entry in the same PR - a site that no longer violates its rule
# fails the check as stale.
#
# Known scope limits inherited from the checker (deliberate, not bugs to file):
#
# - The enclosing-symbol scan is lexical, not a TypeScript parse. Inside a
#   multi-line brace import list the nearest preceding declaration-shaped line is
#   the last named type in the list, which is why the four session-runtime.ts
#   entries are fingerprinted under `type ListSessionsOptions`. The specifier half
#   still makes each site unique, which is what the ledger needs.
#
# - Import rules fingerprint the specifier, so two symbols imported from the same
#   module on separate lines share a fingerprint and take an ordinal. Repairing
#   either leaves the other, and the survivor keeps the lower ordinal.
#
# - Nothing here tolerates a whole file. Every entry is (rule, path, site), so a
#   second violation of the same rule elsewhere in a listed file still fails.




