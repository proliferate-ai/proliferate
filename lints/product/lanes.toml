# The lane census — the ruled law (2026-08-26): every check belongs to exactly
# one pipeline, and every pipeline has an honest trigger — a dispatch-only lane
# doesn't exist. One [[lane]] row per workflow job; [[quarantine]] rows are the
# only sanction for continue-on-error, and they expire. Enforced both
# directions by scripts/check_lanes.py; delivery spec:
# delivery/testing-cicd/delivery-spec-lane-census.md.
#
# Pipelines: pr · main · nightly · release · prod · dispatch-with-sunset ·
# reusable ("reusable" = workflow_call-only files; their jobs run in their
# callers' pipelines). A matrix job is one row: the census records job
# definitions, not expansions. gate_mirrored marks jobs whose commands the
# pre-push gate mirrors byte-for-byte (recorded here; enforced by the gate
# slice, not this checker).

[[rule]]
id = "PROD-LANE-001"
title = "Every CI job carries a lane-census row, and no row outlives its job"
owner = "product"
status = "law"
enforced_by = "scripts/check_lanes.py"
mode = "lint"
scope = ".github/workflows/*.yml"

rule = """Every job in every workflow has exactly one [[lane]] row in lints/product/lanes.toml, and every row names a job that still exists."""
alternative = """Add the row in the same PR that adds or renames the job (run `python3 scripts/check_lanes.py --print-missing` for a stub); delete the row in the same PR that deletes the job."""
why = """The census is how "what runs where" stays legible: the 2026-08 cull left lanes that existed on paper and never ran, and nobody could say which. Ruled 2026-08-26."""

[rule.example]
bad = "a new deploy job merged with no census row"
good = "the same PR adds [[lane]] workflow/job/pipeline/cadence"

[[rule]]
id = "PROD-LANE-002"
title = "A lane's declared pipeline matches a real trigger; dispatch-only lanes carry a sunset"
owner = "product"
status = "law"
enforced_by = "scripts/check_lanes.py"
mode = "lint"
scope = ".github/workflows/*.yml"

rule = """A row's pipeline must match the workflow's actual triggers (pr needs a pull_request trigger, main needs push/workflow_run, nightly needs schedule, release needs push/workflow_call, prod needs schedule/push, reusable needs workflow_call — workflow_dispatch is always an allowed extra, never the qualifying trigger), and a dispatch-only workflow must be pipeline dispatch-with-sunset with an unexpired sunset date."""
alternative = """Give the lane its honest trigger (a cron, a push, a workflow_run), or declare dispatch-with-sunset with a real decide-by date — and when the date arrives, promote the cadence or delete the lane."""
why = """A dispatch-only lane is a lane that doesn't exist: intent, heavy lanes, and the anyharness suite all "existed" for weeks while never running. Ruled 2026-08-26."""

[rule.example]
bad = "on: workflow_dispatch only, censused as pipeline = \"nightly\""
good = "a schedule: cron plus pipeline = \"nightly\", or dispatch-with-sunset + sunset = \"2026-09-30\""

[[rule]]
id = "PROD-LANE-003"
title = "continue-on-error exists only under an unexpired quarantine row"
owner = "product"
status = "law"
enforced_by = "scripts/check_lanes.py"
mode = "lint"
scope = ".github/workflows/*.yml"

rule = """Every continue-on-error in a workflow job is covered by a [[quarantine]] row naming an owner and an unexpired expires date; a quarantine row with no surviving continue-on-error is stale and fails."""
alternative = """Fix the flake and delete both the flag and the row; or, while it is genuinely quarantined, keep the dated row current — expiry means fix it or re-rule it, never silence."""
why = """continue-on-error masked a fully red staging e2e lane as green for weeks (0 green / 4 failed / 9 blocked reported "success", observed 2026-08-25). Red must mean red. Ruled 2026-08-26."""

[rule.example]
bad = "continue-on-error: true with no quarantine row"
good = "[[quarantine]] workflow/job/owner/reason/expires beside the flag"

