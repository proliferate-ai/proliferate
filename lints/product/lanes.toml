# ── Quarantine (continue-on-error sanctions; they expire) ──────────────────
#
# KNOWN GAP: quarantine rows model workflow JOBS (continue-on-error) only —
# per-TEST quarantine (a flaky test pinned by name, owner + expiry, instead of
# a skip-comment) has no schema yet. The two original candidates (2026-08-27:
# the workspace_stop kill-escalation flake and the fork_dispatch double-fork
# teardown flake) were FIXED AT ROOT the same day — fixture trap-ordering and
# a bounded-retry teardown, in the test-races-and-lock-debt slice — and the
# lock map cleared the await_holding_lock hypothesis (all sites were test
# support; the debt itself was retired and the lint is now deny). The schema
# gap stays open with no live candidate. Owned by the ci-cd spec's Known
# gaps; do not grow this file's schema ad hoc.

