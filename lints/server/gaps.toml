# Server grid gaps — the seed ledger.
#
# Every record here is a known-unenforced edge of the grid ownership model
# (specs/codebase/structures/server/guides/grid-ownership-model.md, §Current
# gaps). They are `status = "leaks"`, `mode = "review"`, `enforced_by =
# "review"`: no checker detects them today, so these records enforce nothing.
# They exist so the gap has an id, an owner, a rule sentence, and a legal
# alternative that a reviewer can cite — and so a future checker has something
# to be measured against.
#
# Closing one means writing the detector, moving the record to the family file
# it belongs to, and flipping status to law or holds. Weakening or deleting one
# is an amendment (see lints/README.md).

# ── SRV-COORD ───────────────────────────────────────────────────────────

[[rule]]
id = "SRV-COORD-1"
title = "Grid legality is a function of coordinates"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/**"

rule = """Whether one module may import another must be decidable from their
grid coordinates (domain column x layer row) alone, read from a checked-in
coordinate map."""
alternative = """Until a coordinate map exists, place code by the layer rules in
the grid guide and cite the specific SRV-* record that governs the edge you are
crossing."""
why = """The enforced boundary rules are a bounded, hand-classified subset:
scripts/check_server_boundaries.py path-classifies a fixed set of directories
and checks a fixed set of forbidden imports. There is no checked-in TOML
coordinate map, no general check_grid.py, no generated service graph, and no
automatic owner/consumer map, so a new coordinate is legal by default instead
of legal by declaration."""

[rule.example]
bad = "a new server/proliferate/server/<domain>/helpers/ layer nobody classified, importing anything it likes"
good = "a coordinate map that names the layer and the import audiences it may reach"

# ── SRV-STORE ───────────────────────────────────────────────────────────

[[rule]]
id = "SRV-STORE-6"
title = "Every store has one declared owner and a foreign-read ledger"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/db/store/**"

rule = """Each store module must declare its owning domain, and every read from
a domain that does not own it must be an entry in an exact foreign-read
ledger."""
alternative = """Route the write through the owning domain's public service
(SRV-STORE-5 enforces the named subset today) and get the foreign read reviewed
against the owning domain."""
why = """A store owner can only query every consumer before changing a contract
if the consumer set is written down. The domain guide currently permits foreign
reads through stores, and the checker has no complete owner table and no exact
foreign-read ledger, so cross-domain write repair stays a bounded migration
(SRV-STORE-5) rather than a repository-wide coordinate law."""

[rule.example]
bad = "a billing service reading proliferate.db.store.organizations with nothing recording that it does"
good = "store owner = organizations, with billing listed as a ledgered foreign reader"

[[rule]]
id = "SRV-STORE-7"
title = "Stores return frozen dataclasses, not ORM rows"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/db/store/**"

rule = """A store's public functions must return frozen dataclasses; ORM
instances must not escape the store layer, and callers above the store must not
mutate or flush them."""
alternative = """Map the ORM row to a frozen dataclass inside the store and
return that; do the mutation through a store function."""
why = """The type pipeline is ORM -> frozen dataclass -> Pydantic, so an ORM row
above the store carries a live session and lazy loads into layers that have no
transaction. Stores such as db/store/users.py and db/store/billing_subjects.py
still return ORM types. No checker detects a leaked ORM
return type."""

[rule.example]
bad = "async def get_user(...) -> User:  # returns the SQLAlchemy model"
good = "async def get_user(...) -> UserRecord:  # frozen dataclass mapped in the store"

# ── SRV-SEAM ────────────────────────────────────────────────────────────

[[rule]]
id = "SRV-SEAM-1"
title = "Authorization composes at the endpoint, not inside services"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/server/**"

rule = """Endpoints must compose the four authorization boundaries — actor
authentication (auth/dependencies.py), org standing (permissions.py), resource
access (the owning domain's access.py), and pure policy (the owning domain's
domain/policy.py) — and pass the resolved result to the service; services must
not make access decisions inline."""
alternative = """Move the check into the owning domain's access.py or
domain/policy.py and declare it as an endpoint dependency."""
why = """Authorization scattered through orchestration hides access decisions
and makes an authentication change cross domain boundaries. Adoption is partial:
Organization role gates in organizations/service.py, Cloud integration admin
checks in integration_gateway/connections/service.py are still inline, and permissions.py itself
composes actor deps, stores, billing services, and request/RLS context — only
auth/authorization.py is the dependency-free authorization leaf. No checker
classifies an inline service check."""

[rule.example]
bad = "if actor.role != \"admin\": raise ... # inside organizations/service.py"
good = "actor: AdminActor = Depends(require_org_admin)  # composed on the route"

# ── SRV-LIB ─────────────────────────────────────────────────────────────

[[rule]]
id = "SRV-LIB-1"
title = "Shared libraries have a declared audience"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/lib/**"

rule = """Every lib/** leaf must have a declared audience and obey it:
lib/infra is universal and product-blind; lib/product is pure and importable
only from a product domain's service.py, domain/**, models.py, and
worker/service.py; lib/capabilities carries an explicit domain-consumer map. A
concern enters lib/** only after a second real consumer exists."""
alternative = """Keep single-consumer machinery with its owning domain, and pick
the lib/** audience that matches what the code is allowed to know."""
why = """A shared folder that may import anything becomes a junk drawer and
pulls single-domain policy out of its owner prematurely. The server checker does
not scan lib/** for audience or purity at all, and current non-Product consumers
of lib/product are outside the declared audience."""

[rule.example]
bad = "a store importing proliferate.lib.product.redirect_callback"
good = "proliferate.lib.infra.time imported from any layer; lib/product only from a product-domain service"

# ── SRV-TOPO ────────────────────────────────────────────────────────────

[[rule]]
id = "SRV-TOPO-1"
title = "The service import graph is acyclic"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/server/**/service.py"

rule = """Service-to-service imports must form an acyclic graph; two domains
must not import each other's service."""
alternative = """Extract the shared orchestration into a lib/capabilities leaf
with a declared consumer map, or invert one direction through an event or an
explicit caller-owned parameter."""
why = """A service cycle means neither domain can be refactored, tested, or
deployed independently. Cloud Sandbox imports Gateway service in
cloud/cloud_sandboxes/service.py while Gateway imports Cloud Sandbox service in
cloud/gateway/service.py, and no generated graph rejects that cycle."""

[rule.example]
bad = "cloud_sandboxes/service.py imports gateway/service.py, which imports cloud_sandboxes/service.py"
good = "one direction only, or a shared lib/capabilities leaf both call"

# ── SRV-PKG ─────────────────────────────────────────────────────────────

[[rule]]
id = "SRV-PKG-1"
title = "Third-party packages are limited by coordinate"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/**"

rule = """A third-party package may be imported only from the coordinates an
explicit package-audience map grants it."""
alternative = """Import the vendor package in the integration that owns the
vendor and let the service consume the integration's product-shaped result."""
why = """Vendor SDKs imported directly from product code make the vendor's
failure model and data shapes part of the domain. Only a few specific vendor
imports are checked today (SRV-DOMAIN-1, SRV-INTEG-*, SRV-MODELS-3); there is no
package-audience map, so every other package is allowed everywhere."""

[rule.example]
bad = "import boto3  # in a product domain service.py"
good = "the integration owning the vendor imports boto3; the service calls the integration"

# ── SRV-BG ──────────────────────────────────────────────────────────────

[[rule]]
id = "SRV-BG-1"
title = "Background work has one execution model"
owner = "server"
status = "leaks"
gap = "#1714"
enforced_by = "review"
mode = "review"
scope = "server/proliferate/**"

rule = """Scheduled work must be a Beat-fired Celery task and durable follow-up
work an outbox-fired Celery task; there are no domain schedulers, process-owned
periodic loops, or worker.py entry points, and only the outbox relay below
background/** reads a store directly."""
alternative = """Move the loop body into the owning domain's worker/service.py
and fire it as a thin Celery task from Beat or the outbox."""
why = """Domain-owned loops each bring their own restart, observability, and
failure model, so work is neither uniformly restartable nor uniformly
observable. Periodic process loops remain in billing/reconciler.py,
anonymous_telemetry/worker.py, and three Agent Gateway loops in
agent_auth/worker.py, and background/enqueue_health.py is a direct
background-store client. Closing this needs a deployed, behaviour-equivalent
background plane before any checker can be turned on."""

[rule.example]
bad = "while True: await asyncio.sleep(60); await reconcile()  # in billing/reconciler.py"
good = "@celery_app.task def reconcile_billing(): ...  # fired by Beat"
