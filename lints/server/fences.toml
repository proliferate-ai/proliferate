# Server domain fences — which modules under server/proliferate/ may import
# the FENCED server systems (the layer rules are boundaries.toml's job; this
# file owns the importer→system import edge set). Enforced by
# scripts/check_server_fences.py, introduced enforcing by agent_auth slice 5
# (delivery/agent-auth/delivery-spec-slice-5-gateway-hygiene.md) per the
# fence-enforcement table in specs/systems/agent_auth/README.md §0.
#
# Only the systems named under [fence] are fenced; every other server system
# stays governed by the manifests and the layer rules alone.
#
# The [[edge]] tables below are SRV-FENCE-001's baseline: the measured
# importer→system import graph at fence introduction — permissive by
# construction, shrink-only afterwards. The checker fails on a new edge AND on
# a stale row, so this list always equals reality exactly. Removing a row when
# its last crossing import dies is maintenance; adding a row is a net-new
# coupling and therefore an amendment (see lints/README.md Constitution).
#
# Importer labels follow scripts/check_manifests.py's importer_label(): the
# top-level domain under server/ (`billing`), `cloud/<sub>` for the cloud
# subsystems, the bare filename for package-root modules (`main.py`), or the
# first path segment for code outside server/ (`background`, `integrations`).

[fence]
systems = ["agent_auth", "ai_gateway"]

[[rule]]
id = "SRV-FENCE-001"
title = "modules import the fenced server systems only along declared edges"
owner = "server"
status = "law"
enforced_by = "scripts/check_server_fences.py"
mode = "lint"
scope = "server/proliferate/**"

rule = """A module may import a fenced server system (`proliferate.server.agent_auth`, `proliferate.server.ai_gateway`) only along a from→to edge declared in the [[edge]] baseline of this record file; the baseline is measured reality at introduction and may only shrink — a new edge and a stale row both fail."""
alternative = """Express the need through an already-declared edge or the owning system's public surface. A genuinely new edge is a constitution amendment: flag it in the PR description and stop for founder review."""
why = """Moves around a credential-custody system must not quietly add coupling: freezing the measured edge graph (6 edges at introduction, 2026-08-26) makes every new importer of agent_auth or ai_gateway a visible amendment and gives any later re-grouping a shrink-only starting line."""

[rule.example]
bad = """`from proliferate.server.ai_gateway.budget import get_gateway_enrollment_for_user` from a domain with no declared edge to ai_gateway"""
good = """the same import along an edge the baseline already declares"""

# ---------------------------------------------------------------------------
# SRV-FENCE-001 edge baseline: the measured importer→system import graph at
# fence introduction. Generated by the checker's own scan; shrink-only.
# ---------------------------------------------------------------------------


[[edge]]
from = "accounts"
to = "ai_gateway"

[[edge]]
from = "agent_auth"
to = "ai_gateway"

[[edge]]
from = "billing"
to = "ai_gateway"

[[edge]]
from = "main.py"
to = "agent_auth"

[[edge]]
from = "main.py"
to = "ai_gateway"

[[edge]]
from = "organizations"
to = "ai_gateway"
